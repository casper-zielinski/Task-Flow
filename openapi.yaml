openapi: 3.0.3
info:
  title: TaskFlow API
  description: REST API of TaskFlow, a task management system for personal tasks.
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Tasks
    description: Manage tasks
paths:
  /api/tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks
      description: >
        Returns the tasks, sorted by priority (HOCH first) and then by due date
        (earliest first). All filters are optional and can be combined.
      operationId: getTasks
      parameters:
        - name: status
          in: query
          description: Only tasks with this status
          schema:
            $ref: '#/components/schemas/Status'
        - name: priority
          in: query
          description: Only tasks with this priority
          schema:
            $ref: '#/components/schemas/Priority'
        - name: due
          in: query
          description: >
            Only tasks matching this due date filter. Completed tasks (ABGESCHLOSSEN)
            are never overdue. overdue = due date before today; today = due date is
            today; thisWeek = due date from Monday to Sunday of the current week.
          schema:
            type: string
            enum: [overdue, today, thisWeek]
        - name: search
          in: query
          description: Search term, matched against title and description
          schema:
            type: string
        - name: page
          in: query
          description: Page number, starting at 0
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of tasks per page
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: List of tasks
          headers:
            X-Total-Count:
              description: Total number of tasks matching the filters (all pages)
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Tasks]
      summary: Create a new task
      description: The ID and the creation timestamp are assigned automatically.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/tasks/stats:
    get:
      tags: [Tasks]
      summary: Get task statistics
      operationId: getTaskStats
      responses:
        '200':
          description: Task statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStats'
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get a single task
      description: Returns all information of the task including the status history.
      operationId: getTaskById
      responses:
        '200':
          description: The requested task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tasks]
      summary: Update a task
      description: >
        Updates all attributes except the ID and the creation timestamp.
        A change of the status is stored in the status history.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      responses:
        '204':
          description: Task deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Unique ID of the task
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Task not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Status:
      type: string
      enum: [OFFEN, IN_BEARBEITUNG, ABGESCHLOSSEN]
    Priority:
      type: string
      enum: [NIEDRIG, MITTEL, HOCH]
    Task:
      type: object
      required: [id, title, priority, status, createdAt]
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        title:
          type: string
          example: Write test cases
        description:
          type: string
          example: Cover all six endpoints
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/Status'
        dueDate:
          type: string
          format: date
          example: '2026-11-15'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Creation timestamp, set automatically
          example: '2026-10-28T09:30:00Z'
        changedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of the last status change
          example: '2026-10-29T14:00:00Z'
    TaskDetail:
      description: A task including the history of its status changes
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [statusHistory]
          properties:
            statusHistory:
              type: array
              readOnly: true
              description: Status changes, oldest first
              items:
                $ref: '#/components/schemas/StatusChange'
    StatusChange:
      type: object
      required: [status, changedAt]
      properties:
        status:
          $ref: '#/components/schemas/Status'
        changedAt:
          type: string
          format: date-time
          example: '2026-10-29T14:00:00Z'
    TaskInput:
      type: object
      required: [title, priority]
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          allOf:
            - $ref: '#/components/schemas/Status'
          default: OFFEN
          description: Defaults to OFFEN if omitted
        dueDate:
          type: string
          format: date
    TaskStats:
      type: object
      description: Number of tasks per status and number of overdue tasks
      required: [open, inProgress, completed, overdue]
      properties:
        open:
          type: integer
          description: Tasks with status OFFEN
        inProgress:
          type: integer
          description: Tasks with status IN_BEARBEITUNG
        completed:
          type: integer
          description: Tasks with status ABGESCHLOSSEN
        overdue:
          type: integer
          description: Overdue tasks (due date before today, status not ABGESCHLOSSEN)
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Clear message in English with a hint on how to fix the problem
          example: One or more fields are invalid.
        errors:
          type: array
          description: Field-level errors, only present for validation errors (400)
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Name of the invalid field
          example: title
        message:
          type: string
          description: What is wrong with the field
          example: must not be empty
